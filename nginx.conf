server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve all static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(css|js|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|webmanifest|xml)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Never cache env.js (it contains runtime config)
    location = /env.js {
        add_header Content-Type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
        try_files /env.js /env.template.js =404;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml text/xml application/manifest+json;
}
